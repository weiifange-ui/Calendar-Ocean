#sea{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .6s}
#sea.on{opacity:1}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.05) translate(-1.2%,.6%)}}
.waves{position:fixed;left:0;right:0;top:0;height:100%;z-index:0;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.waves svg{position:absolute;left:0;width:200%;height:44px;animation:flow linear infinite}
.waves path{fill:none;stroke:#fff;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linecap:round}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 20px 72px}
header{min-height:30vh;padding:clamp(28px,6vw,64px) 0 24px}
h1{font-weight:700;color:var(--sky-ink);font-size:clamp(34px,6vw,58px);letter-spacing:.12em;line-height:1.2;margin:0}
.sub{color:var(--sky-sub);margin:.4em 0 0;font-size:clamp(15px,1.8vw,18px);letter-spacing:.08em}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.months button{font:inherit;font-size:14px;color:var(--foam);background:var(--panel);border:1px solid rgba(255,255,255,.35);border-radius:999px;min-height:44px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--foam);color:var(--deep);font-weight:500}
.months button:focus-visible{outline:2px solid var(--raw);outline-offset:2px}
.now{font-size:clamp(24px,3.4vw,32px);font-weight:500;margin:40px 0 0;letter-spacing:.06em;text-shadow:0 1px 10px rgba(12,30,48,.6)}
.hint{color:var(--foam-dim);margin:0;font-size:14px;text-shadow:0 1px 8px rgba(12,30,48,.6)}
.catch{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:72px 24px;margin-top:72px}
.card{position:relative;background:var(--panel);border-radius:16px}
.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.frame path{fill:none;stroke:var(--brush);stroke-linecap:round;stroke-linejoin:round}
.fish{padding:64px 20px 20px;min-height:180px}
.art{position:absolute;top:-50px;right:18px;width:150px;animation:bob 5.5s ease-in-out infinite}
.art svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.2deg)}}
.fish h3{margin:0;font-size:21px;font-weight:700;letter-spacing:.05em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-weight:400;font-size:12px;padding:1px 9px;border-radius:999px;color:#14304a}
.tag.raw{background:var(--raw)}.tag.cooked{background:var(--cooked)}
.fish p{margin:6px 0 0;font-size:14px;color:var(--foam-dim)}
.fish .eat{color:var(--foam)}
.year-card{margin-top:96px;padding:40px 22px 24px}
.year-card h2{position:absolute;top:-21px;left:30px;margin:0;font-weight:500;font-size:24px;letter-spacing:.08em;line-height:1.6;text-shadow:0 1px 10px rgba(12,30,48,.6)}
.legend{display:flex;gap:18px;font-size:13px;color:var(--foam-dim);margin-bottom:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.scroll{overflow-x:auto;padding:6px 2px}
.year{display:grid;grid-template-columns:108px repeat(12,minmax(26px,1fr));gap:3px;min-width:520px;font-size:13px}
.year .m{text-align:center;color:var(--foam-faint);padding-bottom:4px}
.year .m.cur{color:var(--foam);font-weight:500}
.year .n{padding:4px 0;line-height:1.3}
.year .n small{display:block;color:var(--foam-faint);font-size:11px}
.year .c{border-radius:4px;background:var(--empty)}
.year .c.raw{background:rgba(134,214,189,.5)}.year .c.cooked{background:rgba(241,179,127,.5)}
.year{position:relative}.curcol{position:absolute;pointer-events:none}
.note{margin:16px 0 0;font-size:13px;color:var(--foam-faint)}
.version{margin:40px 0 0;text-align:center;font-size:12px;color:var(--foam-faint);letter-spacing:.04em}
.yearbar{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.yearbar button{font:inherit;font-size:18px;color:var(--foam);background:var(--panel);border:1px solid rgba(255,255,255,.35);border-radius:999px;min-width:44px;min-height:44px;padding:0 14px;cursor:pointer}
.yearbar button:focus-visible{outline:2px solid var(--raw);outline-offset:2px}
.yearbar .today-btn{margin-left:auto;font-size:14px}
.yearbar .y{font-size:22px;font-weight:700;min-width:6.5em;text-align:center;line-height:1.2;color:var(--foam);background:var(--panel);border-radius:999px;padding:4px 16px}
.yearbar .y small{display:block;font-size:12px;font-weight:400;color:var(--foam-dim)}
.cal-card{margin-top:64px;padding:42px 18px 20px}
.cal-card h2{position:absolute;top:-21px;left:30px;margin:0;font-weight:700;font-size:24px;letter-spacing:.06em;line-height:1.6;text-shadow:0 1px 10px rgba(12,30,48,.6)}
.cal-sub{margin:0;font-size:13px;color:var(--foam-dim)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.mnav{display:flex;gap:8px;margin-left:auto}
.mnav button{font:inherit;font-size:14px;color:var(--foam);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer}
.mnav button:hover{background:rgba(255,255,255,.2)}
.mnav button:focus-visible{outline:2px solid var(--raw);outline-offset:2px}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk div{text-align:center;font-size:13px;color:var(--foam-faint);padding-bottom:4px}
.wk .we{color:#ffc9b8}
.day{position:relative;font:inherit;color:var(--foam);background:none;border:0;border-radius:12px;padding:6px 2px 8px;min-height:74px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.day:hover{background:rgba(255,255,255,.07)}
.day[aria-pressed="true"]{background:rgba(255,255,255,.16)}
.day:focus-visible{outline:2px solid var(--raw);outline-offset:1px}
.day .n{font-size:19px;font-weight:500;line-height:1.3}
.day.we .n{color:#ffc9b8}
.day.off .n{color:#ffa48f}
.day .lu{font-size:11px;color:var(--foam-faint);line-height:1.4}
.day .lu.mon{color:var(--foam)}
.day .sp{font-size:11px;line-height:1.4;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp.off,.chip.off{color:#ffa48f}.sp.fest,.chip.fest{color:#f6d58e}.sp.term,.chip.term{color:#9fe3cc}
.day.pad{visibility:hidden;cursor:default}
.detail{margin-top:14px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.3);font-size:15px}
.detail .dt{font-size:18px;font-weight:700}
.detail p{margin:4px 0 0;color:var(--foam-dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:1px 10px;border-radius:999px;border:1px solid currentColor}
@media (max-width:640px){
.page{padding:0 14px 56px}
header{min-height:24vh;padding:32px 0 20px}
.months{grid-template-columns:repeat(6,minmax(0,1fr))}
.now{margin-top:28px}
.catch{grid-template-columns:minmax(0,1fr);gap:64px;margin-top:64px}
.fish{min-height:0}
.year-card{margin-top:80px;padding:36px 12px 18px}
.year-card h2{left:22px;top:-17px;font-size:20px}
.year{grid-template-columns:64px repeat(12,minmax(0,1fr));min-width:0;font-size:12px;gap:2px}
.year .n small{display:none}
.legend{flex-wrap:wrap}
.cal-card{margin-top:56px;padding:38px 6px 16px}
.cal-card h2{left:22px;top:-17px;font-size:20px}
.cal-head,.detail,.cal-card .legend,.cal-card .note{padding:0 8px}
.mnav{width:100%}.mnav button{flex:1}
.wk,.days{gap:2px}
.day{min-height:64px;padding:4px 0 6px}
.day .n{font-size:16px}
.yearbar .y{font-size:19px;min-width:5.5em}
}
@media (prefers-reduced-motion:reduce){.bg,.art{animation:none}}
</style>
</head>

/* 水墨筆刷框：沿圓角矩形取點，挖掉缺口，再畫三層不同粗細的筆觸 */
function perimeter(W,H,r,step){
  const pts=[];const line=(x1,y1,x2,y2)=>{const n=Math.max(1,Math.round(Math.hypot(x2-x1,y2-y1)/step));for(let i=0;i<n;i++)pts.push([x1+(x2-x1)*i/n,y1+(y2-y1)*i/n]);};
  const arc=(cx,cy,a1,a2)=>{for(let i=0;i<6;i++){const a=a1+(a2-a1)*i/6;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}};
  const P=Math.PI;
  line(r,0,W-r,0);arc(W-r,r,-P/2,0);line(W,r,W,H-r);arc(W-r,H-r,0,P/2);line(W-r,H,r,H);arc(r,H-r,P/2,P);line(0,H-r,0,r);arc(r,r,P,1.5*P);
  return pts;
}
function brushPath(pts,seed,amp){
  const a=seed*1.7,b=seed*3.1;let len=0;
  const q=pts.map((p,i)=>{if(i)len+=Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]);const j=Math.sin(len*.045+a)*amp+Math.sin(len*.11+b)*amp*.5;return[p[0]+j*.7,p[1]+j];});
  let d=`M${q[0][0].toFixed(1)},${q[0][1].toFixed(1)}`;
  for(let i=1;i<q.length-1;i++){const mx=(q[i][0]+q[i+1][0])/2,my=(q[i][1]+q[i+1][1])/2;d+=` Q${q[i][0].toFixed(1)},${q[i][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;}
  const L=q[q.length-1];return d+` L${L[0].toFixed(1)},${L[1].toFixed(1)}`;
}
function drawFrame(card,seed,inGap,r){
  const W=card.clientWidth,H=card.clientHeight;if(!W||!H)return;

  if(!svg){svg=document.createElementNS(NS,"svg");svg.setAttribute("class","frame");svg.setAttribute("aria-hidden","true");card.prepend(svg);}
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const all=perimeter(W,H,r||15,6);
  const gapIdx=all.map(inGap(W,H));
  let start=gapIdx.findIndex((g,i)=>g&&!gapIdx[(i+1)%all.length]);start=(start+1)%all.length;
  const pts=[];for(let k=0;k<all.length;k++){const i=(start+k)%all.length;if(!gapIdx[i])pts.push(all[i]);}
  const passes=[[2.8,.85,"",1.3],[1.2,.5,"",2.2],[1,.55,"26 5 9 4 40 6",.8]];
  svg.innerHTML=passes.map(([w,o,dash,amp],k)=>`<path filter="url(#brush)" d="${brushPath(pts,seed+k*5,amp)}" stroke-width="${w}" opacity="${o}"${dash?` stroke-dasharray="${dash}"`:""}></path>`).join("");
}

const TERMS=["小寒","大寒","立春","雨水","驚蟄","春分","清明","穀雨","立夏","小滿","芒種","夏至","小暑","大暑","立秋","處暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];

  const om=(125.04-1934.136*t)*r;
  return(((L0+C-0.00569-0.00478*Math.sin(om))%360)+360)%360;
}
const tcache=new Map();
function terms(y){

    map[(t.getUTCMonth()+1)+"-"+t.getUTCDate()]=TERMS[i];
  }
  tcache.set(y,map);return map;
}

/* 國定假日（off）與通用節日（fest）*/
function holidays(y,m,d,lu,term){
  const out=[],add=(n,s,t)=>out.push({n,s,t});
  const eff=y*10000+m*100+d>=20250531;
  const dow=new Date(y,m-1,d).getDay();
  const k=m+"-"+d;
  const solar={
    "1-1":["中華民國開國紀念日","元旦","off"],"2-14":["情人節","情人節","fest"],"2-28":["和平紀念日","和平紀念","off"],
    "3-8":["婦女節","婦女節","fest"],"3-12":["植樹節","植樹節","fest"],"3-29":["青年節","青年節","fest"],"4-4":["兒童節","兒童節","off"],
    "5-1":["勞動節","勞動節",eff?"off":"fest"],"8-8":["父親節","父親節","fest"],"9-28":["孔子誕辰紀念日（教師節）","教師節",eff?"off":"fest"],
    "10-10":["國慶日","國慶日","off"],"10-25":["臺灣光復暨金門古寧頭大捷紀念日","光復節",eff?"off":"fest"],
    "12-25":["行憲紀念日","行憲紀念",eff?"off":"fest"]
  };
  if(solar[k])add(...solar[k]);
  if(term==="清明")add("民族掃墓節（清明節）","清明節","off");
  if(!lu.leap){
    const lk=lu.m+"-"+lu.d;
    const lmap={"1-1":["春節（正月初一）","春節","off"],"1-2":["春節（正月初二）","春節","off"],"1-3":["春節（正月初三）","春節","off"],
      "1-15":["元宵節","元宵節","fest"],"5-5":["端午節","端午節","off"],"7-7":["七夕","七夕","fest"],"7-15":["中元節","中元節","fest"],
      "8-15":["中秋節","中秋節","off"],"9-9":["重陽節","重陽節","fest"],"12-8":["臘八節","臘八","fest"],"12-16":["尾牙","尾牙","fest"]};
    if(lmap[lk])add(...lmap[lk]);
  }
  const n1=lunarAt(y,m,d+1),n2=lunarAt(y,m,d+2);
  if(n1.m===1&&n1.d===1&&!n1.leap)add("除夕","除夕","off");
  if(n2.m===1&&n2.d===1&&!n2.leap)add("小年夜（除夕前一日）","小年夜",eff?"off":"fest");
  if(m===5&&dow===0&&d>=8&&d<=14)add("母親節","母親節","fest");
  if(k==="12-25")add("聖誕節","聖誕節","fest");
  return out;
}
function info(y,m,d){
  const lu=lunar(y,m,d),term=terms(y)[m+"-"+d]||"";
  const hs=holidays(y,m,d,lu,term);
  const off=hs.find(h=>h.t==="off"),fest=hs.find(h=>h.t==="fest");
  const sp=off?{s:off.s,t:"off"}:fest?{s:fest.s,t:"fest"}:term?{s:term,t:"term"}:null;
  return{lu,term,hs,sp,off:!!off};
}
const luText=lu=>(lu.leap?"閏":"")+LMN[lu.m-1]+ldName(lu.d);

function cal(){
  const y=selY,m=sel,first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate();
  if(selD>n)selD=n;
  $("yLabel").innerHTML=`${y} 年<small>民國 ${y-1911} 年</small>`;
  $("calTitle").textContent=`${y}年${m}月`;
  const a=lunar(y,m,1),b=lunar(y,m,n),mid=lunar(y,m,15);
  $("calSub").textContent=`農曆 ${luText(a)} 至 ${luText(b)}｜${ganzhi(mid.ry)}年（${zodiac(mid.ry)}）`;
  let h="";
  for(let i=0;i<first;i++)h+=`<span class="day pad" aria-hidden="true"></span>`;
  for(let d=1;d<=n;d++){
    const f=info(y,m,d),dow=(first+d-1)%7;
    const isT=y===T.y&&m===T.m&&d===T.d;
    const lu=f.lu.d===1?`<span class="lu mon">${(f.lu.leap?"閏":"")+LMN[f.lu.m-1]}</span>`:`<span class="lu">${ldName(f.lu.d)}</span>`;
    const sp=f.sp?`<span class="sp ${f.sp.t}">${f.sp.s}</span>`:"";
    const label=`${m}月${d}日 星期${WD[dow]}，農曆${luText(f.lu)}${f.term?"，"+f.term:""}${f.hs.map(x=>"，"+x.n).join("")}${isT?"，今天":""}`;
    h+=`<button type="button" class="day${dow===0||dow===6?" we":""}${f.off?" off":""}${isT?" today":""}" data-d="${d}" aria-pressed="${d===selD}" aria-label="${label}"><span class="n">${d}</span>${lu}${sp}</button>`;
  }
  $("days").innerHTML=h;
  detail();
}
function detail(){
  const y=selY,m=sel,d=selD,f=info(y,m,d),dow=new Date(y,m-1,d).getDay();
  const isT=y===T.y&&m===T.m&&d===T.d;
  const chips=[...f.hs.map(x=>`<span class="chip ${x.t}">${x.t==="off"?"國定假日｜":""}${x.n}</span>`),f.term?`<span class="chip term">節氣｜${f.term}</span>`:""].join("");
  const fish=D.filter(x=>x[2].includes(m)).map(x=>x[0]).join("、");
  $("detail").innerHTML=`<div class="dt">${y}年${m}月${d}日　星期${WD[dow]}${isT?"（今天）":""}</div><p>農曆${ganzhi(f.lu.ry)}年 ${luText(f.lu)}</p>${chips?`<div class="chips">${chips}</div>`:""}<p>本月當令：${fish}</p>`;
}
function ringToday(){const t=document.querySelector(".day.today");if(t)drawFrame(t,23,()=>()=>false,14);}
function renderAll(){months();cal();year();catchOf();}

$("months").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;sel=+b.dataset.m;selD=(selY===T.y&&sel===T.m)?T.d:1;renderAll();});
$("days").addEventListener("click",e=>{const b=e.target.closest("button.day");if(!b)return;selD=+b.dataset.d;document.querySelectorAll(".day[aria-pressed]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));detail();});
const setY=y=>{selY=Math.min(2099,Math.max(1901,y));selD=(selY===T.y&&sel===T.m)?T.d:Math.min(selD,new Date(selY,sel,0).getDate());renderAll();};
const shiftM=k=>{let y=selY,m=sel+k;if(m<1){m=12;y--;}if(m>12){m=1;y++;}if(y<1901||y>2099)return;selY=y;sel=m;selD=(selY===T.y&&sel===T.m)?T.d:1;renderAll();};
$("prevM").addEventListener("click",()=>shiftM(-1));
$("nextM").addEventListener("click",()=>shiftM(1));
let sx=null,sy=0;
$("days").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$("days").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)shiftM(dx<0?1:-1);});
$("prevY").addEventListener("click",()=>setY(selY-1));
$("nextY").addEventListener("click",()=>setY(selY+1));
$("goToday").addEventListener("click",()=>{selY=T.y;sel=T.m;selD=T.d;renderAll();});
renderAll();
if(document.fonts)document.fonts.ready.then(drawAll);
/* 水面漣漪：用 WebGL 讓插畫本身的浪花線條在原地起伏，不另外疊圖，所以不會模糊 */
(function(){
  const cv=$("sea"),bg=$("bg");
  const gl=cv.getContext("webgl",{premultipliedAlpha:false,antialias:false});
  if(!gl)return;
  const m=getComputedStyle(bg).backgroundImage.match(/url\(["']?(.*?)["']?\)/);if(!m)return;
  const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision highp float;uniform sampler2D tex;uniform vec2 res,img;uniform float t;
  void main(){
    vec2 fp=vec2(gl_FragCoord.x,res.y-gl_FragCoord.y);
    float s=max(res.x/img.x,res.y/img.y);
    vec2 uv=(fp-(res-img*s)*.5)/s/img;
    float band=smoothstep(.19,.25,uv.y)*(1.-smoothstep(.43,.50,uv.y));
    vec3 c0=texture2D(tex,uv).rgb;
    float water=smoothstep(.40,.56,dot(c0,vec3(.299,.587,.114)));
    vec2 dp=(uv-vec2(.62,.335))*img;dp.y*=4.;
    float r=length(dp);vec2 dir=dp/(r+1.);dir.y*=.25;
    float w=sin(r*.085-t*1.7)*.65+sin(r*.041-t*.95+1.3)*.35;
    vec2 off=dir*w*2.2;
    off+=vec2(sin(uv.y*img.y*.11+t*1.15+uv.x*9.)*1.1,sin(uv.x*img.x*.045-t*1.35+uv.y*20.)*.55);
    gl_FragColor=vec4(texture2D(tex,uv+band*water*off/img).rgb,1.);
  }`;
  const sh=(type,src)=>{const o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;
  gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);
  const still=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const im=new Image();
  im.onload=()=>{
    const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
    gl.uniform2f(U("img"),im.naturalWidth,im.naturalHeight);
    const tu=U("t");
    const draw=ms=>{gl.uniform1f(tu,ms/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);};
    const size=()=>{const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d);gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(U("res"),cv.width,cv.height);};
    size();new ResizeObserver(()=>{size();if(still)draw(0);}).observe(cv);
    if(still){draw(0);}else{const loop=ms=>{draw(ms);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
    cv.classList.add("on");
  };
  im.src=m[1];
})();
</script>
